<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pendaftaran Berhasil — Kantin Nuha</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:Arial,Helvetica,sans-serif;background:#f4f7fb;color:#172033}.card{width:100%;max-width:430px;padding:42px 30px 34px;text-align:center;background:#fff;border-radius:22px;box-shadow:0 12px 35px rgba(23,32,51,.10)}.brand{margin-bottom:28px;font-size:25px;font-weight:800;letter-spacing:.3px}.success-icon{width:76px;height:76px;margin:0 auto 24px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:#e9f8ef;color:#20a35a;font-size:42px;font-weight:700}h1{margin:0 0 14px;font-size:27px;line-height:1.25}p{margin:0 auto;max-width:340px;font-size:16px;line-height:1.65;color:#667085}.button{display:inline-block;margin-top:28px;padding:13px 24px;border-radius:12px;background:#172033;color:#fff;text-decoration:none;font-size:15px;font-weight:700}.note{margin-top:22px;font-size:13px;line-height:1.5;color:#98a2b3}@media(max-width:480px){.card{padding:36px 22px 30px}h1{font-size:24px}}
</style>
</head>
<body>
<main class="card">
<div class="brand">Kantin Nuha</div>
<div class="success-icon" aria-label="Berhasil">✓</div>
<h1>Pendaftaran Berhasil!</h1>
<p>Email kamu telah berhasil dikonfirmasi. Akun kamu sudah aktif dan siap digunakan.</p>
<a class="button" href="javascript:history.back()">Kembali</a>
<div class="note">Silakan kembali ke aplikasi Kantin Nuha dan login menggunakan akun yang baru saja didaftarkan.</div>
</main>
</body>
</html>
